- name: Create Read Policy File
  template:
    src: read-policy.hcl.j2
    dest: /tmp/read-policy.hcl
  run_once: true

- name: Create Read Policy
  command: >
    consul acl policy create
    -name read-policy
    -rules @/tmp/read-policy.hcl
  run_once: true

- name: Create Developer Role
  command: >
    consul acl role create
    -name developer-role
    -policy-name read-policy
  run_once: true

- name: Create Developer Token
  command: >
    consul acl token create
    -description "Developer Token"
    -role-name developer-role
  run_once: true
