# --------------------------------------------------
# WAIT FOR CONSUL API
# --------------------------------------------------

- name: Wait for Consul API
  ansible.builtin.wait_for:
    host: "{{ consul_bind_addr }}"
    port: 8501
    delay: 5
    timeout: 60

# --------------------------------------------------
# SET CLI ENVIRONMENT
# --------------------------------------------------

- name: Set Consul CLI environment
  set_fact:
    consul_cli_env:
      CONSUL_HTTP_ADDR: "https://127.0.0.1:8501"
      CONSUL_HTTP_SSL_VERIFY: "false"
      CONSUL_HTTP_TOKEN: "{{ lookup('env','CONSUL_HTTP_TOKEN') }}"
  run_once: true

# --------------------------------------------------
# POLICY CHECK
# --------------------------------------------------

- name: Get existing policies
  command: consul acl policy list
  register: policy_list
  environment: "{{ consul_cli_env }}"
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['all'][0] }}"

# --------------------------------------------------
# CREATE AGENT POLICY
# --------------------------------------------------

- name: Create agent policy
  command: >
    consul acl policy create
    -name agent-policy
    -rules @{{ role_path }}/files/policies/agent-policy.hcl
  environment: "{{ consul_cli_env }}"
  when: "'agent-policy' not in policy_list.stdout"
  run_once: true
  delegate_to: "{{ groups['all'][0] }}"

# --------------------------------------------------
# TOKEN CHECK
# --------------------------------------------------

- name: Get existing tokens
  command: consul acl token list
  register: token_list
  environment: "{{ consul_cli_env }}"
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['all'][0] }}"

# --------------------------------------------------
# CREATE AGENT TOKEN
# --------------------------------------------------

- name: Create agent token
  command: >
    consul acl token create
    -description "Agent Token"
    -policy-name agent-policy
    -format json
  register: agent_token
  environment: "{{ consul_cli_env }}"
  when: "'Agent Token' not in token_list.stdout"
  run_once: true
  delegate_to: "{{ groups['all'][0] }}"

# --------------------------------------------------
# EXTRACT SECRET ID
# --------------------------------------------------

- name: Set agent token fact
  set_fact:
    consul_agent_token: >-
      {{
        (agent_token.stdout | from_json).SecretID
        if agent_token is defined and agent_token.stdout != ""
        else ""
      }}
  run_once: true

# --------------------------------------------------
# DISTRIBUTE TOKEN TO ALL NODES
# --------------------------------------------------

- name: Copy agent token to all nodes
  copy:
    content: "{{ hostvars[groups['all'][0]].consul_agent_token }}"
    dest: "{{ consul_config_dir }}/agent.token"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0600"
  when: hostvars[groups['all'][0]].consul_agent_token is defined
