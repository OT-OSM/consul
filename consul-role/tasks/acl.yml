- name: Wait for Consul API
  ansible.builtin.wait_for:
    host: "{{ consul_bind_addr }}"
    port: 8501
    delay: 5
    timeout: 60

- block:

    - name: Create agent policy
      command: >
        consul acl policy create
        -name agent-policy
        -rules @{{ role_path }}/files/policies/agent-policy.hcl
      register: agent_policy
      failed_when: false
      changed_when: "'Created' in agent_policy.stdout"

    - name: Create agent token
      command: >
        consul acl token create
        -description "Agent Token"
        -policy-name agent-policy
        -format json
      register: agent_token
      when: agent_policy.changed

    - name: Extract agent SecretID
      set_fact:
        consul_agent_token: "{{ (agent_token.stdout | from_json).SecretID }}"
      when: agent_token.stdout is defined

  environment:
    CONSUL_HTTP_ADDR: "https://127.0.0.1:8501"
    CONSUL_HTTP_SSL_VERIFY: "false"
    CONSUL_HTTP_TOKEN: "{{ lookup('env','CONSUL_HTTP_TOKEN') }}"
  run_once: true
