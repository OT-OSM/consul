---
- name: Copy policy files
  ansible.builtin.template:
    src: "policies/{{ item }}.hcl.j2"
    dest: "/tmp/{{ item }}.hcl"
  loop:
    - agent-policy
    - service-policy
    - readonly-policy

- name: Create Consul policies
  ansible.builtin.command: >
    consul acl policy create
    -name {{ item }}
    -rules @/tmp/{{ item }}.hcl
  loop:
    - agent-policy
    - service-policy
    - readonly-policy
  run_once: true
  failed_when: false
  environment:
    CONSUL_HTTP_ADDR: "https://{{ consul_bind_addr }}:8501"
    CONSUL_HTTP_TOKEN: "{{ consul_master_token }}"
    CONSUL_HTTP_SSL_VERIFY: "false"
