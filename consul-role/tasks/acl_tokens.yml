---

* name: Create agent token
  ansible.builtin.command: >
  consul acl token create
  -description "Agent Token"
  -policy-name agent-policy
  register: agent_token
  run_once: true
  failed_when: false
  environment:
  CONSUL_HTTP_ADDR: "https://{{ consul_bind_addr }}:8501"
  CONSUL_HTTP_TOKEN: "{{ consul_master_token }}"
  CONSUL_HTTP_SSL_VERIFY: "false"

* name: Extract agent token
  ansible.builtin.set_fact:
  consul_agent_token_generated: "{{ agent_token.stdout | regex_search('SecretID:\s+(\S+)', '\1') }}"
  when: agent_token.stdout is defined
  run_once: true

* name: Save agent token
  ansible.builtin.copy:
  content: "{{ consul_agent_token_generated }}"
  dest: "{{ consul_config_dir }}/agent.token"
  owner: "{{ consul_user }}"
  group: "{{ consul_group }}"
  mode: "0600"
  when: consul_agent_token_generated is defined
  run_once: true

