- name: Create TLS cert directory
  ansible.builtin.file:
    path: "{{ consul_config_dir }}/certs"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"

- name: Copy TLS certificate
  ansible.builtin.copy:
    src: tls.crt
    dest: "{{ consul_config_dir }}/certs/tls.crt"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"
  notify: Restart Consul

- name: Copy TLS private key
  ansible.builtin.copy:
    src: tls.key
    dest: "{{ consul_config_dir }}/certs/tls.key"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0600"
  notify: Restart Consul

- name: Deploy Consul server configuration
  ansible.builtin.template:
    src: server.hcl.j2
    dest: "{{ consul_config_dir }}/server.hcl"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0640"
  notify: Restart Consul

- name: Register web service
  copy:
    src: web-service.json
    dest: "{{ consul_config_dir }}/web-service.json"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"
