---
# common
consul_owner: consul
consul_group: consul

# consul binary
consul_binary_dir: /usr/local/bin
consul_binary_perm: 0440
consul_binary_owner: root
consul_binary_group: root

# consul user
consul_user_home: /etc/consul.d
consul_user_shell: /bin/false

# consul-hcl file
consul_hcl_dest: /etc/consul.d/consul.hcl
consul_hcl_mode: 0640

# server-hcl file
server_hcl_dest: /etc/consul.d/server.hcl
server_hcl_mode: 0640

# consul-service file
consul_service_file: /etc/systemd/system/consul.service
description: HashiCorp Consul - A service mesh solution
documentation: https://www.consul.io/
requires: network-online.target
after: network-online.target
cond_file_not_empty: /etc/consul.d/consul.hcl
type: notify
exec_start: /usr/local/bin/consul agent -config-dir=/etc/consul.d/
exec_reload: /usr/local/bin/consul reload
kill_mode: process
restart: on-failure
limit_file: 65536
wanted_by: multi-user.target

# Optional consul-template integration
consul_enable_haproxy_template: false

consul_template_version: "0.39.1"

consul_template_binary: "/usr/local/bin/consul-template"

consul_template_config_dir: "/etc/consul-template"

consul_template_consul_address: "127.0.0.1:8500"


# HAProxy configuration

haproxy_enabled: false

haproxy_config_file: "/etc/haproxy/haproxy.cfg"

haproxy_frontend_port: 80


# Load balanced services
# This is generic.
# Add/remove services without changing templates.

haproxy_services: []

# Example:
#
# haproxy_services:
#   - name: keycloak
#     domain: keycloak.example.com
#
#   - name: minio
#     domain: minio.example.com



# DNS Management

consul_dns_enabled: true

dns_domain: ""

dns_records: []

# Example:
#
# dns_domain: example.com
#
# dns_records:
#   - name: keycloak
#     ip: 10.0.0.10
#
#   - name: minio
#     ip: 10.0.0.10
