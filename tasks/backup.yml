---
- name: Check if AWS CLI is installed
  ansible.builtin.command: aws --version
  register: aws_check
  ignore_errors: true
  changed_when: false

- name: Install AWS CLI v2
  block:
    - name: Install unzip
      ansible.builtin.package:
        name: unzip
        state: present
      become: true

    - name: Download AWS CLI v2 bundle
      ansible.builtin.get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
        dest: "/tmp/awscliv2.zip"
        mode: '0644'

    - name: Unarchive AWS CLI bundle
      ansible.builtin.unarchive:
        src: "/tmp/awscliv2.zip"
        dest: "/tmp"
        remote_src: true

    - name: Run AWS CLI installation script
      ansible.builtin.command:
        cmd: "/tmp/aws/install --update"
      become: true
  when: aws_check.failed

- name: Set backup name
  ansible.builtin.set_fact:
    consul_backup_name: "consul_backup_{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: /tmp/consul-backups
    state: directory
    mode: "0755"

- name: Take Consul snapshot
  ansible.builtin.command:
    cmd: "consul snapshot save /tmp/consul-backups/{{ consul_backup_name }}.snap"
  environment:
    CONSUL_HTTP_ADDR: "https://127.0.0.1:{{ consul_https_port }}"
    CONSUL_HTTP_TOKEN: "{{ consul_master_token }}"
    CONSUL_HTTP_SSL_VERIFY: "false"
  register: snapshot_result
  become: true
  changed_when: snapshot_result.rc == 0

- name: Upload backup to MinIO (S3)
  ansible.builtin.command: >
    aws s3 cp /tmp/consul-backups/{{ consul_backup_name }}.snap
    s3://{{ consul_backup_bucket }}/{{ consul_backup_name }}.snap
    --endpoint-url {{ consul_backup_minio_endpoint }}
    --no-verify-ssl
  environment:
    AWS_ACCESS_KEY_ID: "{{ consul_backup_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ consul_backup_s3_secret_key }}"
  register: upload_result
  retries: 3
  delay: 20
  until: upload_result.rc == 0
  run_once: true
  become: true
  when: snapshot_result is succeeded

- name: Delete local backup file
  ansible.builtin.file:
    path: "/tmp/consul-backups/{{ consul_backup_name }}.snap"
    state: absent
