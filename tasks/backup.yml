---
- name: Download consul-backup script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/opstree/consul-backup/main/consul-backup.sh"
    dest: /usr/local/bin/consul-backup
    mode: "0755"
  become: true

- name: Set backup name
  ansible.builtin.set_fact:
    consul_backup_name: "backup_{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

- name: Ensure config directory exists
  ansible.builtin.file:
    path: /etc/consul-backup
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Configure consul-backup
  ansible.builtin.template:
    src: consul-backup-config.yml.j2
    dest: /etc/consul-backup/config.yml
    owner: root
    group: root
    mode: "0640"
  become: true
  when: consul_backup_enabled | bool

- name: Create Consul backup
  ansible.builtin.command:
    cmd: "consul-backup create {{ consul_backup_name }}"
  register: backup_create
  become: true
  changed_when: "'done' in (backup_create.stdout | default(''))"
  when: consul_backup_enabled | bool

- name: Upload backup to remote storage
  ansible.builtin.command:
    cmd: "consul-backup upload {{ consul_backup_name }} -v"
  register: upload_result
  retries: 3
  delay: 20
  until: upload_result.rc == 0
  run_once: true
  become: true
  changed_when: "'done' in (upload_result.stdout | default(''))"
  when: consul_backup_enabled | bool
