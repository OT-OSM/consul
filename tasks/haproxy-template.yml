---

- name: Install HAProxy
  apt:
    name: haproxy
    state: present
    update_cache: yes


- name: Download consul-template
  get_url:
    url: "https://releases.hashicorp.com/consul-template/{{ consul_template_version }}/consul-template_{{ consul_template_version }}_linux_amd64.zip"
    dest: /tmp/consul-template.zip


- name: Install unzip
  apt:
    name: unzip
    state: present


- name: Extract consul-template
  unarchive:
    src: /tmp/consul-template.zip
    dest: /usr/local/bin
    remote_src: yes


- name: Create consul-template directory
  file:
    path: "{{ consul_template_config_dir }}"
    state: directory


- name: Configure consul-template
  template:
    src: consul-template.hcl.j2
    dest: "{{ consul_template_config_dir }}/config.hcl"


- name: Configure HAProxy template
  template:
    src: haproxy.ctmpl.j2
    dest: "{{ consul_template_config_dir }}/haproxy.ctmpl"


- name: Install consul-template service
  template:
    src: consul-template.service.j2
    dest: /etc/systemd/system/consul-template.service


- name: Install HAProxy service
  template:
    src: haproxy.service.j2
    dest: /etc/systemd/system/haproxy.service


- name: Reload systemd
  systemd:
    daemon_reload: yes


- name: Enable HAProxy
  systemd:
    name: haproxy
    enabled: yes
    state: started


- name: Enable consul-template
  systemd:
    name: consul-template
    enabled: yes
    state: restarted
