---
# ✅ Step 1: Check if the existing method is JWT (to prevent 500 error on Type change)
- name: Check current Keycloak auth method type
  ansible.builtin.uri:
    url: "http://127.0.0"
    method: GET
    headers:
      X-Consul-Token: "{{ consul_master_token }}"
    status_code: [200, 404]
  register: existing_method
  run_once: true

# ✅ Step 2: Delete if it is NOT OIDC (Consul cannot update Type in-place)
- name: Delete existing JWT method to allow OIDC creation
  ansible.builtin.uri:
    url: "http://127.0.0"
    method: DELETE
    headers:
      X-Consul-Token: "{{ consul_master_token }}"
    status_code: [200, 204]
  run_once: true
  when: 
    - existing_method.status == 200
    - existing_method.json.Type != 'oidc'

# ✅ Step 3: Create/Update the OIDC Auth Method
- name: Upsert Keycloak OIDC Auth Method via API
  ansible.builtin.uri:
    url: "http://127.0.0"
    method: POST
    headers:
      X-Consul-Token: "{{ consul_master_token }}"
    body_format: json
    body:
      Name: "keycloak"
      Type: "oidc"
      Description: "SSO via Keycloak"
      MaxTokenTTL: "{{ consul_oidc_max_token_ttl }}"
      Config:
        OIDCDiscoveryURL: "{{ keycloak_internal_url }}/realms/{{ keycloak_realm }}"
        BoundIssuer: "{{ keycloak_url }}/realms/{{ keycloak_realm }}"
        OIDCClientID: "{{ consul_oidc_client_id }}"
        OIDCClientSecret: "{{ consul_oidc_client_secret }}"
        OIDCInsecureTLS: true
        BoundAudiences: ["{{ consul_oidc_client_id }}"]
        AllowedRedirectURIs: "{{ consul_oidc_redirect_uris }}"
        ClaimMappings:
          preferred_username: "username"
        ListClaimMappings:
          groups: "groups"
    status_code: [200, 201]
  run_once: true

# ✅ Step 4: Create Binding Rule
- name: Create Binding Rule for SSO Users
  ansible.builtin.command: >
    consul acl binding-rule create
    -method="keycloak"
    -bind-type="policy"
    -bind-name="readonly-policy"
    -selector="list.groups contains /consul-users"
  environment:
    CONSUL_HTTP_ADDR: "http://127.0.0.1:8500"
    CONSUL_HTTP_TOKEN: "{{ consul_master_token }}"
  run_once: true
  register: binding_rule_out
  failed_when:
    - binding_rule_out.rc != 0
    - "'already exists' not in binding_rule_out.stderr"
